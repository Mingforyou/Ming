<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="王咏琪的 OC 互动页：建模、独立文游《伊斯卡利》、同人账号、cosplay 与美工。"
    />
    <title>更多｜王咏琪的 OC</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/oc.css" />
  </head>
  <body class="oc-page">
    <main class="oc-stage" id="main">
      <img class="oc-bg" src="../assets/img/oc-scene-full.jpg" alt="王咏琪的 OC：地下设施中的金发角色" />
      <div class="oc-overlay" aria-hidden="true"></div>

      <div class="oc-credit-cover" aria-hidden="true">
        <svg viewBox="0 0 64 64" shape-rendering="crispEdges">
          <rect x="10" y="14" width="12" height="14" fill="#141414"/>
          <rect x="42" y="14" width="12" height="14" fill="#141414"/>
          <rect x="12" y="16" width="8" height="9" fill="#f3efe5"/>
          <rect x="44" y="16" width="8" height="9" fill="#f3efe5"/>
          <rect x="14" y="22" width="36" height="30" fill="#141414"/>
          <rect x="16" y="24" width="32" height="26" fill="#f3efe5"/>
          <rect x="12" y="26" width="40" height="4" fill="#e43b2e"/>
          <rect x="6" y="28" width="8" height="14" fill="#e43b2e"/>
          <rect x="50" y="28" width="8" height="14" fill="#e43b2e"/>
          <rect x="20" y="34" width="6" height="6" fill="#141414"/>
          <rect x="38" y="34" width="6" height="6" fill="#141414"/>
          <rect x="28" y="44" width="8" height="3" fill="#e43b2e"/>
          <rect x="16" y="52" width="8" height="4" fill="#141414"/>
          <rect x="40" y="52" width="8" height="4" fill="#141414"/>
        </svg>
        <span>明明</span>
      </div>

      <header class="oc-topbar">
        <a class="oc-back" href="../index.html">← 返回首页</a>
        <p class="oc-crumb"><span>MORE</span> / 王咏琪的 OC</p>
      </header>

      <h1 class="oc-visually-hidden">王咏琪的 OC 互动页</h1>

      <nav class="oc-buttons" aria-label="OC 记忆目录">
        <button class="oc-btn" type="button" data-oc-topic="model" aria-expanded="false">
          <span class="oc-btn__num">01</span>
          <span class="oc-btn__label">C4D建模</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
        <button class="oc-btn" type="button" data-oc-topic="iskari" aria-expanded="false">
          <span class="oc-btn__num">02</span>
          <span class="oc-btn__label">独立文游【伊斯卡利】</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
        <button class="oc-btn" type="button" data-oc-topic="fan" aria-expanded="false">
          <span class="oc-btn__num">03</span>
          <span class="oc-btn__label">同人账号</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
        <button class="oc-btn" type="button" data-oc-topic="cosplay" aria-expanded="false">
          <span class="oc-btn__num">04</span>
          <span class="oc-btn__label">cosplay</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
        <button class="oc-btn" type="button" data-oc-topic="art" aria-expanded="false">
          <span class="oc-btn__num">05</span>
          <span class="oc-btn__label">美工</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
      </nav>

      <section class="oc-dialogue" aria-live="polite">
        <p class="oc-name">王咏琪的OC</p>
        <p class="oc-line" data-oc-line></p>
        <p class="oc-dialogue__hint">点击右侧按钮，读取一段记忆</p>
      </section>

      <div class="oc-modal" data-oc-modal hidden>
        <div class="oc-modal__backdrop" data-oc-close></div>
        <article class="oc-modal__card" role="dialog" aria-modal="true" aria-labelledby="oc-modal-title">
          <button class="oc-modal__close" type="button" data-oc-close aria-label="关闭">×</button>
          <p class="oc-modal__eyebrow" data-oc-eyebrow>MEMORY / 01</p>
          <h2 id="oc-modal-title" data-oc-title>建模</h2>
          <p class="oc-modal__body" data-oc-body></p>
          <div class="oc-modal__tags" data-oc-tags></div>
          <div class="oc-process" data-oc-process hidden>
            <div class="oc-process__tabs" role="tablist" aria-label="伊斯卡利制作流程">
              <button class="oc-process__tab is-active" type="button" role="tab" aria-selected="true" data-oc-step="persona">01 确定人设</button>
              <button class="oc-process__tab" type="button" role="tab" aria-selected="false" data-oc-step="world">02 搭建世界观</button>
              <button class="oc-process__tab" type="button" role="tab" aria-selected="false" data-oc-step="script">03 产出文案脚本</button>
              <button class="oc-process__tab" type="button" role="tab" aria-selected="false" data-oc-step="commission">04 约稿配图</button>
            </div>
            <div class="oc-process__panel">
              <p class="oc-process__tag" data-oc-step-tag>STEP 01 / CHARACTER</p>
              <h3 data-oc-step-title>确定人设</h3>
              <p data-oc-step-body></p>
              <div class="oc-process__link" data-oc-step-link></div>
            </div>
          </div>
          <div class="oc-modal__media" data-oc-media hidden></div>
        </article>
      </div>

      <div class="oc-lightbox" data-oc-lightbox hidden>
        <button class="oc-lightbox__close" type="button" data-oc-lightbox-close aria-label="关闭大图">×</button>
        <img data-oc-lightbox-img alt="" />
      </div>
    </main>

    <script src="../assets/js/oc.js"></script>
  </body>
</html>
