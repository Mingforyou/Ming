<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="王咏琪的 OC 互动页：建模、独立文游《伊斯卡利》、同人账号、cosplay 与美工。"
    />
    <title>更多｜王咏琪的 OC</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/oc.css" />
  </head>
  <body class="oc-page">
    <main class="oc-stage" id="main">
      <img class="oc-bg-blur" src="../assets/img/oc-scene-hd.jpg" alt="" aria-hidden="true" />
      <img class="oc-bg" src="../assets/img/oc-scene-hd.jpg" alt="王咏琪的 OC：地下设施中的金发角色" />
      <div class="oc-overlay" aria-hidden="true"></div>

      <header class="oc-topbar">
        <a class="oc-back" href="../index.html">← 返回首页</a>
        <p class="oc-crumb"><span>MORE</span> / 王咏琪的 OC</p>
      </header>

      <h1 class="oc-visually-hidden">王咏琪的 OC 互动页</h1>

      <nav class="oc-buttons" aria-label="OC 记忆目录">
        <button class="oc-btn" type="button" data-oc-topic="model" aria-expanded="false">
          <span class="oc-btn__num">01</span>
          <span class="oc-btn__label">C4D建模</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
        <button class="oc-btn" type="button" data-oc-topic="iskari" aria-expanded="false">
          <span class="oc-btn__num">02</span>
          <span class="oc-btn__label">独立文游【伊斯卡利】</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
        <button class="oc-btn" type="button" data-oc-topic="fan" aria-expanded="false">
          <span class="oc-btn__num">03</span>
          <span class="oc-btn__label">同人账号</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
        <button class="oc-btn" type="button" data-oc-topic="cosplay" aria-expanded="false">
          <span class="oc-btn__num">04</span>
          <span class="oc-btn__label">cosplay</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
        <button class="oc-btn" type="button" data-oc-topic="art" aria-expanded="false">
          <span class="oc-btn__num">05</span>
          <span class="oc-btn__label">美工</span>
          <span class="oc-btn__arrow" aria-hidden="true">↗</span>
        </button>
      </nav>

      <section class="oc-dialogue" aria-live="polite">
        <p class="oc-name">王咏琪的OC</p>
        <p class="oc-line" data-oc-line></p>
        <p class="oc-dialogue__hint">点击右侧按钮，读取一段记忆</p>
      </section>

      <div class="oc-modal" data-oc-modal hidden>
        <div class="oc-modal__backdrop" data-oc-close></div>
        <article class="oc-modal__card" role="dialog" aria-modal="true" aria-labelledby="oc-modal-title">
          <button class="oc-modal__close" type="button" data-oc-close aria-label="关闭">×</button>
          <p class="oc-modal__eyebrow" data-oc-eyebrow>MEMORY / 01</p>
          <h2 id="oc-modal-title" data-oc-title>建模</h2>
          <p class="oc-modal__body" data-oc-body></p>
          <div class="oc-modal__tags" data-oc-tags></div>
        </article>
      </div>
    </main>

    <script src="../assets/js/oc.js"></script>
  </body>
</html>
